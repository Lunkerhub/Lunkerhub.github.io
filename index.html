<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second SMP | Bedrock</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#141416;--line:#2a1a1c;--red:#e03033;--red-d:#2e1214;--txt:#f4f1f1;--mut:#8d8a8b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(60% 40% at 50% 0,#3a0e12 0,transparent 70%) no-repeat;color:var(--txt);font:400 16px/1.5 "Manrope",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px}
.logo{font:700 26px "Pixelify Sans",monospace;background:var(--red);padding:2px 12px;border-radius:6px;display:inline-block;transform:skew(-8deg)}
h1,h2{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:700;line-height:1.1}
h1{font-size:clamp(28px,8vw,38px);margin:22px 0 16px}
h2{font-size:28px;margin:44px 0 16px}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block;border:1px solid var(--line);box-shadow:0 0 60px -10px rgba(224,48,51,.45);margin-top:22px}
input{width:100%;padding:18px 20px;border-radius:10px;border:1px solid #2c2c30;background:transparent;color:var(--txt);font:600 17px "Manrope",sans-serif}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.err{color:#ff6b6e;font-size:14px;min-height:20px;margin:6px 0}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 20px;border-radius:10px;border:0;background:var(--red);color:#fff;font:800 17px "Manrope",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:#ee3d40}
.btn.ghost{background:transparent;border:1px solid #333;justify-content:center;margin-top:12px;font-weight:600}
.info{background:var(--card);border-radius:16px;padding:8px 20px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0}.row+.row{border-top:1px solid #222}
.k{color:var(--mut);width:78px;flex:none}.v{font-weight:800;font-size:18px;flex:1;word-break:break-all}
.copy{background:var(--red-d);color:#ff6b6e;border:0;border-radius:8px;padding:8px 12px;font:600 14px "Manrope",sans-serif;cursor:pointer}
.copy.ok{background:#12301c;color:#6ee08a}
.back{background:none;border:0;color:var(--mut);font:600 16px "Manrope",sans-serif;cursor:pointer;padding:18px 0 8px}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#333}.dot.on{background:#3fbf5f;box-shadow:0 0 10px #3fbf5f}
.bar{width:44px;height:3px;background:#2a2a2a}.bar.on{background:#3fbf5f}
.who{text-align:center;color:var(--mut);margin:6px 0 22px}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{flex:1;padding:12px 8px;border-radius:10px;border:1px solid #333;background:transparent;color:var(--mut);font:700 15px "Manrope",sans-serif;cursor:pointer}
.tab.on{border-color:var(--red);background:var(--red-d);color:#fff}
.list{display:grid;gap:10px}
.item{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.nm{font-weight:800;font-size:18px}.pr{color:#ff6b6e;font-weight:800;font-size:18px}.pr small{color:var(--mut);font-weight:600}
.ds{color:var(--mut);font-size:14px;line-height:1.35;margin-top:2px}
.item .buy{background:var(--red-d);color:#ff6b6e;border:0;border-radius:8px;padding:14px 20px;font:800 16px "Manrope",sans-serif;cursor:pointer;flex:none}
.item .buy:hover{background:#3d171a}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:14px}
details ul{padding-left:18px;font-size:14px;margin-top:4px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 20px;margin:18px 0}
.hide{display:none}
.note{color:var(--mut);font-size:14px;margin:12px 0}
ol.s{padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.s li{counter-increment:s;background:var(--card);border-radius:12px;padding:14px 14px 14px 56px;position:relative}
ol.s li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:6px;background:var(--red-d);color:#ff6b6e;font:700 18px "Pixelify Sans",monospace;display:grid;place-items:center}
</style>
</head>
